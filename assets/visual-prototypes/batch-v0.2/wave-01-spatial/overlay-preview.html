<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashCards Wave 01 Spatial Overlay Preview</title>
  <style>
    :root { color-scheme: light; background: #f8f6f0; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f8f6f0; color: #202223; }
    main { max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    figure { margin: 0; padding: 12px; background: #fffdf8; border: 1px solid #e3ded2; border-radius: 18px; }
    .stage { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 12px; background: #f8f6f0; }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    figcaption { padding-top: 10px; font-weight: 700; }
    small { display: block; margin-top: 3px; font-weight: 400; color: #59605d; }
  </style>
</head>
<body>
  <main>
    <h1>Wave 01 · Spatial instructional overlays</h1>
    <p>Clean base asset plus optional static-position overlay. The overlay uses no motion trails.</p>
    <section class="grid">
      <figure>
        <div class="stage"><img src="behind-v1.png" alt="Behind base"><img src="overlays/behind-depth.svg" alt="Behind depth overlay"></div>
        <figcaption>Behind<small>front plane → rear/upper plane; arrowhead points away from the viewer</small></figcaption>
      </figure>
      <figure>
        <div class="stage"><img src="in-front-of-v2.png" alt="In front of base"><img src="overlays/in-front-of-depth.svg" alt="In front of depth overlay"></div>
        <figcaption>In front of<small>rear plane → foreground anchor; arrowhead follows the forward cue</small></figcaption>
      </figure>
      <figure>
        <div class="stage"><img src="inside-v1.png" alt="Inside base"><img src="overlays/inside-down.svg" alt="Inside downward overlay"></div>
        <figcaption>Inside<small>downward cue terminates inside the container</small></figcaption>
      </figure>
      <figure>
        <div class="stage"><img src="near-v2.png" alt="Near base"><img src="overlays/near-gap.svg" alt="Near gap overlay"></div>
        <figcaption>Near<small>short inward heads mark the narrow gap, not movement</small></figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
