<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Cards ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: #fff9f0;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 14px 12px 30px;
  overflow-x: hidden; position: relative;
}
.bubble {
  position: fixed; border-radius: 50%; opacity: 0.10;
  animation: floatUp linear infinite; pointer-events: none;
}
@keyframes floatUp {
  0%   { transform: translateY(110vh) rotate(0deg); }
  100% { transform: translateY(-20vh) rotate(360deg); }
}
/* Course, session, and phase selectors */
#course-selector { display:flex; gap:8px; margin:10px 0 2px; z-index:10; position:relative; flex-wrap:wrap; justify-content:center; }
.course-btn {
  font-family:'Fredoka One',cursive; font-size:0.9rem;
  border:3px solid #ff6b6b; border-radius:50px;
  padding:0.48rem 1.15rem; cursor:pointer; background:#fff; color:#cf4f4f;
  transition:all 0.2s; box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.course-btn.active { background:#ff6b6b; color:#fff; box-shadow:0 0 0 3px #ffd166; }
#session-selector { display:flex; gap:8px; margin:8px 0 2px; z-index:10; position:relative; flex-wrap:wrap; justify-content:center; }
.session-btn {
  font-family:'Fredoka One',cursive; font-size:0.88rem;
  border:3px solid #4ecdc4; border-radius:50px;
  padding:0.45rem 1rem; cursor:pointer; background:#fff; color:#2b8e86;
  transition:all 0.2s; box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.session-btn.active { background:#4ecdc4; color:#fff; box-shadow:0 0 0 3px #baf0eb; }
#phase-selector { display:flex; gap:10px; margin:8px 0 8px; z-index:10; position:relative; }
.phase-btn {
  font-family:'Fredoka One',cursive; font-size:0.95rem;
  border:3px solid transparent; border-radius:50px;
  padding:0.5rem 1.4rem; cursor:pointer;
  transition:all 0.2s; box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.phase-btn.p1 { background:#ff6b6b; color:#fff; }
.phase-btn.p2 { background:#fff; color:#7b5ea7; border-color:#7b5ea7; }
.phase-btn.active.p1 { box-shadow:0 0 0 3px #ffd166; }
.phase-btn.active.p2 { background:#7b5ea7; color:#fff; box-shadow:0 0 0 3px #c8b0e8; }
/* Title */
#main-title {
  font-family:'Fredoka One',cursive;
  font-size:clamp(1.3rem,4vw,2rem); color:#ff6b6b;
  text-align:center; text-shadow:3px 3px 0 #ffd166;
  z-index:10; position:relative; margin-bottom:4px;
}
/* Progress */
#progress-track {
  width:min(92vw,460px); height:9px; background:#e0d5c5;
  border-radius:10px; overflow:hidden; z-index:10; position:relative; margin-bottom:5px;
}
#progress-bar { height:100%; background:linear-gradient(90deg,#ff6b6b,#ffd166); border-radius:10px; transition:width 0.4s ease; }
#counter { font-family:'Fredoka One',cursive; font-size:0.95rem; color:#aaa; margin-bottom:8px; z-index:10; position:relative; }
/* Card */
#stage { perspective:1200px; z-index:10; position:relative; width:min(92vw,460px); margin-bottom:10px; }
#card { width:100%; position:relative; border-radius:28px; transition:transform 0.32s cubic-bezier(.4,0,.2,1); cursor:pointer; }
#card.flipping { transform:rotateY(90deg) scale(0.95); }
.card-face {
  border-radius:28px; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  box-shadow:0 12px 36px rgba(0,0,0,.14);
  padding:14px 14px 12px; gap:5px; position:relative;
  min-height:min(52vw,270px); user-select:none;
}
.card-illus { line-height:0; }
.card-illus svg { border-radius:14px; display:block; }
.card-illus img { width:140px; height:130px; object-fit:contain; border-radius:14px; display:block; }
.card-word { font-family:'Fredoka One',cursive; font-size:clamp(1.7rem,5.5vw,2.8rem); text-align:center; line-height:1.1; color:#fff; text-shadow:2px 3px 0 rgba(0,0,0,.18); }
.card-phonetic { font-size:clamp(0.8rem,2.3vw,1rem); color:rgba(255,255,255,.9); font-weight:700; font-style:italic; }
.card-category { font-size:0.78rem; font-weight:700; color:rgba(255,255,255,.75); background:rgba(0,0,0,.12); padding:2px 12px; border-radius:20px; letter-spacing:1px; text-transform:uppercase; }
.sound-wave { position:absolute; bottom:10px; right:12px; display:flex; gap:3px; align-items:flex-end; height:18px; opacity:0; transition:opacity .3s; }
.sound-wave.active { opacity:1; }
.sound-wave span { display:block; width:3px; border-radius:2px; background:rgba(255,255,255,.85); animation:waveBar .6s ease infinite alternate; }
.sound-wave span:nth-child(1){height:7px;animation-delay:0s}
.sound-wave span:nth-child(2){height:14px;animation-delay:.1s}
.sound-wave span:nth-child(3){height:10px;animation-delay:.2s}
.sound-wave span:nth-child(4){height:18px;animation-delay:.05s}
.sound-wave span:nth-child(5){height:9px;animation-delay:.15s}
@keyframes waveBar { from{transform:scaleY(0.3)} to{transform:scaleY(1)} }
.theme-face      { background:linear-gradient(135deg,#ff9a9e,#fad0c4); }
.theme-hair      { background:linear-gradient(135deg,#a18cd1,#fbc2eb); }
.theme-accessor  { background:linear-gradient(135deg,#ffecd2,#fcb69f); }
.theme-landmark  { background:linear-gradient(135deg,#84fab0,#8fd3f4); }
.theme-transport { background:linear-gradient(135deg,#a1c4fd,#c2e9fb); }
.theme-time      { background:linear-gradient(135deg,#fccb90,#d57eeb); }
.theme-activity  { background:linear-gradient(135deg,#4ecdc4,#6fb1ff); }
.theme-past      { background:linear-gradient(135deg,#8e7cc3,#ffd166); }
.theme-outdoor   { background:linear-gradient(135deg,#2ec4b6,#b7e778); }
.theme-camp      { background:linear-gradient(135deg,#ff9f1c,#ff6b6b); }
.theme-place     { background:linear-gradient(135deg,#00b4d8,#90e0ef); }
.theme-movie     { background:linear-gradient(135deg,#845ec2,#ff9671); }
.theme-family    { background:linear-gradient(135deg,#00c9a7,#f9f871); }
.theme-job       { background:linear-gradient(135deg,#577590,#43aa8b); }
.theme-trait     { background:linear-gradient(135deg,#f9844a,#f9c74f); }
.theme-expression{ background:linear-gradient(135deg,#c77dff,#ffafcc); }
body.course-junior {
  background:#f6f7fb;
  color:#243042;
}
body.course-junior .bubble { opacity:0.045; }
body.course-junior #main-title {
  font-family:'Nunito',sans-serif;
  color:#243042;
  text-shadow:none;
  font-weight:900;
  letter-spacing:0;
}
body.course-junior .course-btn {
  font-family:'Nunito',sans-serif;
  border-color:#4f6f8f;
  color:#35516b;
  border-radius:12px;
  box-shadow:0 3px 0 rgba(36,48,66,.18);
}
body.course-junior .course-btn.active { background:#4f6f8f; color:#fff; box-shadow:0 0 0 3px #d9e6f2; }
body.course-junior .session-btn {
  font-family:'Nunito',sans-serif;
  border-color:#43aa8b;
  color:#2f7b67;
  border-radius:12px;
  box-shadow:0 3px 0 rgba(36,48,66,.14);
}
body.course-junior .session-btn.active { background:#43aa8b; color:#fff; box-shadow:0 0 0 3px #d8f0e8; }
body.course-junior .phase-btn,
body.course-junior button.ctrl,
body.course-junior #p2-listen-btn,
body.course-junior #p2-check-btn,
body.course-junior #btn-restart,
body.course-junior #btn-review-wrong {
  font-family:'Nunito',sans-serif;
  font-weight:900;
  border-radius:14px;
}
body.course-junior #card,
body.course-junior .card-face { border-radius:18px; }
body.course-junior .card-face { box-shadow:0 14px 34px rgba(36,48,66,.16); }
body.course-junior .card-illus svg,
body.course-junior .card-illus img { border-radius:10px; }
body.course-junior .card-illus img { width:min(58vw,220px); height:min(58vw,220px); object-fit:contain; }
body.course-junior #p2-illus-wrap img { width:min(72vw,300px); height:min(72vw,300px); object-fit:contain; }
body.course-junior .card-word {
  font-family:'Nunito',sans-serif;
  font-weight:900;
  text-shadow:none;
  letter-spacing:0;
}
body.course-junior #progress-bar { background:linear-gradient(90deg,#4f6f8f,#43aa8b); }
/* Phase 2 */
#p2-panel { display:none; flex-direction:column; align-items:center; gap:10px; width:min(92vw,460px); z-index:10; position:relative; }
#p2-illus-wrap { border-radius:20px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.12); }
#p2-illus-wrap svg { display:block; border-radius:16px; }
#p2-illus-wrap img { width:140px; height:130px; object-fit:contain; border-radius:16px; display:block; }
#p2-listen-btn {
  font-family:'Fredoka One',cursive; font-size:1.05rem;
  border:none; border-radius:50px; padding:0.65rem 1.8rem;
  cursor:pointer; background:#7b5ea7; color:#fff;
  box-shadow:0 5px 0 #4a3570; transition:transform .15s;
  animation:pulseGlow 2s ease infinite;
}
@keyframes pulseGlow {
  0%,100%{box-shadow:0 5px 0 #4a3570,0 0 0 0 rgba(123,94,167,.4)}
  50%{box-shadow:0 5px 0 #4a3570,0 0 0 8px rgba(123,94,167,0)}
}
#p2-listen-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a3570}
#p2-hint { font-size:1rem; color:#bbb; font-weight:900; letter-spacing:4px; margin-top:-4px; }
#p2-input-wrap { display:flex; gap:8px; align-items:center; width:100%; }
#p2-input {
  flex:1; font-family:'Nunito',sans-serif; font-size:1.15rem; font-weight:900;
  border:3px solid #c8b0e8; border-radius:16px; padding:10px 14px;
  outline:none; background:white; letter-spacing:2px; transition:border-color .2s;
}
#p2-input:focus{border-color:#7b5ea7}
#p2-input.correct{border-color:#4ecdc4;background:#f4fffd}
#p2-input.wrong{border-color:#ff6b6b;background:#fff5f5;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#p2-score { font-size:0.95rem;color:#7b5ea7;font-weight:900;background:white;padding:6px 12px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08); }
#p2-check-btn {
  font-family:'Fredoka One',cursive; font-size:1rem; border:none;
  border-radius:14px; padding:10px 16px; cursor:pointer;
  background:#4ecdc4; color:#fff; box-shadow:0 4px 0 #2bab9e; transition:transform .15s;
}
#p2-check-btn:active{transform:translateY(2px)}
#p2-reveal {
  display:none; flex-direction:column; align-items:center; gap:5px;
  padding:12px 18px; border-radius:18px;
  background:white; box-shadow:0 6px 20px rgba(0,0,0,.1);
  width:100%; text-align:center;
}
.reveal-word { font-family:'Fredoka One',cursive; font-size:clamp(1.5rem,5vw,2.2rem); color:#7b5ea7; }
.reveal-phonetic { font-size:0.95rem; color:#999; font-style:italic; font-weight:700; }
.reveal-feedback { font-size:0.95rem; font-weight:900; }
.fb-correct{color:#4ecdc4} .fb-wrong{color:#ff6b6b}
/* Controls */
#controls { display:flex; gap:8px; align-items:center; z-index:10; position:relative; flex-wrap:wrap; justify-content:center; margin-top:4px; }
button.ctrl {
  font-family:'Fredoka One',cursive; font-size:0.92rem; border:none;
  border-radius:50px; padding:0.58rem 1.2rem; cursor:pointer;
  transition:transform .15s,box-shadow .15s; box-shadow:0 4px 0 rgba(0,0,0,.15);
}
button.ctrl:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn-shuffle{background:#ffd166;color:#333}
.btn-listen{background:#fff;color:#ff6b6b;border:3px solid #ff6b6b !important}
.btn-listen.speaking{background:#ff6b6b;color:#fff}
.btn-next{background:#ff6b6b;color:#fff}
.btn-auto{background:#4ecdc4;color:#fff}
#bottom-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; z-index:10; position:relative; margin-top:6px; }
#speed-wrap { display:flex; align-items:center; gap:6px; font-weight:700; font-size:0.82rem; color:#888; }
#speed-wrap input[type=range]{accent-color:#ff6b6b;cursor:pointer}
#tts-wrap { display:flex; align-items:center; gap:6px; font-weight:700; font-size:0.82rem; color:#888; }
#tts-toggle { width:40px;height:22px;background:#ccc;border-radius:11px;position:relative;cursor:pointer;transition:background .3s;border:none;padding:0;box-shadow:none; }
#tts-toggle::after { content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .3s; }
#tts-toggle.on{background:#4ecdc4}
#tts-toggle.on::after{left:20px}
/* Done overlay */
#done-overlay { display:none;position:fixed;inset:0;background:rgba(255,249,240,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;text-align:center;gap:12px; }
#done-overlay.show{display:flex}
#done-overlay h2{font-size:2.6rem;color:#ff6b6b;text-shadow:3px 3px 0 #ffd166}
#done-overlay p{font-size:1.1rem;color:#888;font-family:'Nunito',sans-serif}
#done-detail { width:min(90vw,560px);max-height:36vh;overflow:auto;background:white;border-radius:8px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.1);font-family:'Nunito',sans-serif;text-align:left;color:#666;line-height:1.45; }
#done-detail:empty{display:none}
.result-section{margin-bottom:10px}
.result-section:last-child{margin-bottom:0}
.result-title{font-weight:900;color:#7b5ea7;margin-bottom:4px}
.result-list{font-size:0.95rem}
#btn-restart,#btn-review-wrong{font-family:'Fredoka One',cursive;font-size:1.1rem;border:none;border-radius:50px;padding:0.7rem 2rem;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#btn-restart{background:#ff6b6b}
#btn-review-wrong{display:none;background:#7b5ea7}

/* Junior editorial UI: calm controls, paper surfaces, and flat inked color. */
body.course-junior {
  --jr-ink:#202a2e;
  --jr-ink-soft:#50646b;
  --jr-canvas:#edf0ef;
  --jr-paper:#f7f3e9;
  --jr-paper-deep:#d8d4c8;
  --jr-blue:#4d6f8d;
  --jr-teal:#4d8c82;
  --jr-green:#6d8d72;
  --jr-mustard:#c99a40;
  --jr-coral:#d46853;
  --jr-shadow:rgba(32,42,46,.20);
  background:var(--jr-canvas);
  color:var(--jr-ink);
  padding:18px 14px 34px;
}

body.course-junior .bubble { display:none; }
body.course-junior #main-title {
  font-family:'Nunito',sans-serif;
  font-size:2rem;
  font-weight:900;
  line-height:1.15;
  color:var(--jr-ink);
  text-shadow:none;
  margin:0 0 14px;
  letter-spacing:.02em;
}
body.course-junior #main-title::after {
  content:'';
  display:block;
  width:42px;
  height:3px;
  margin:8px auto 0;
  background:var(--jr-coral);
}

body.course-junior #course-selector,
body.course-junior #session-selector {
  width:min(100%,460px);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin:0 0 8px;
}
body.course-junior .course-btn,
body.course-junior .session-btn {
  min-width:0;
  min-height:42px;
  padding:8px 10px;
  border:2px solid var(--jr-ink-soft);
  border-radius:8px;
  background:var(--jr-paper);
  color:var(--jr-ink);
  box-shadow:3px 3px 0 var(--jr-paper-deep);
  font-family:'Nunito',sans-serif;
  font-size:.94rem;
  font-weight:900;
  line-height:1.1;
  transition:transform .15s, box-shadow .15s, background .15s, color .15s;
}
body.course-junior #session-selector { grid-template-columns:repeat(3,minmax(0,1fr)); }
body.course-junior .course-btn.active {
  background:var(--jr-blue);
  border-color:var(--jr-blue);
  color:#fff;
  box-shadow:3px 3px 0 var(--jr-ink);
}
body.course-junior .session-btn {
  border-color:var(--jr-teal);
  color:var(--jr-teal);
}
body.course-junior .session-btn.active {
  background:var(--jr-teal);
  border-color:var(--jr-teal);
  color:#fff;
  box-shadow:3px 3px 0 var(--jr-ink);
}
body.course-junior .course-btn:active,
body.course-junior .session-btn:active {
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 var(--jr-paper-deep);
}

body.course-junior #phase-selector {
  width:min(100%,460px);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin:4px 0 12px;
}
body.course-junior .phase-btn {
  min-width:0;
  min-height:48px;
  padding:8px 10px;
  border:2px solid var(--jr-ink-soft);
  border-radius:8px;
  background:var(--jr-paper);
  color:var(--jr-ink);
  box-shadow:3px 3px 0 var(--jr-paper-deep);
  font-family:'Nunito',sans-serif;
  font-size:1rem;
  font-weight:900;
  line-height:1.1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
body.course-junior .phase-btn.p1 {
  background:var(--jr-coral);
  border-color:var(--jr-coral);
  color:#fff;
}
body.course-junior .phase-btn.p2 {
  background:var(--jr-paper);
  border-color:var(--jr-blue);
  color:var(--jr-blue);
}
body.course-junior .phase-btn.active {
  box-shadow:3px 3px 0 var(--jr-ink);
}
body.course-junior .phase-btn.p2.active {
  background:var(--jr-blue);
  color:#fff;
}
.phase-index {
  font-size:.72rem;
  letter-spacing:.08em;
  opacity:.8;
}
body:not(.course-junior) .phase-index { margin-right:7px; }

body.course-junior #progress-track {
  width:min(100%,460px);
  height:7px;
  margin:0 0 7px;
  border:1px solid #c6ccca;
  border-radius:4px;
  background:#d5d8d3;
}
body.course-junior #progress-bar {
  background:var(--jr-teal);
  border-radius:3px;
}
body.course-junior #counter {
  margin:0 0 10px;
  color:var(--jr-ink-soft);
  font-family:'Nunito',sans-serif;
  font-size:.82rem;
  font-weight:900;
  letter-spacing:.12em;
}

body.course-junior #stage {
  width:min(100%,460px);
  margin-bottom:14px;
}
body.course-junior #card,
body.course-junior .card-face {
  border-radius:8px;
}
body.course-junior #card {
  cursor:pointer;
}
body.course-junior .card-face {
  min-height:360px;
  padding:18px 18px 16px;
  gap:9px;
  background:var(--jr-paper) !important;
  border:2px solid var(--jr-ink);
  border-top:7px solid var(--jr-accent,var(--jr-blue));
  box-shadow:7px 7px 0 var(--jr-shadow);
}
body.course-junior .card-face.theme-face,
body.course-junior .card-face.theme-time,
body.course-junior .card-face.theme-trait { --jr-accent:var(--jr-mustard); }
body.course-junior .card-face.theme-hair,
body.course-junior .card-face.theme-family,
body.course-junior .card-face.theme-activity,
body.course-junior .card-face.theme-outdoor { --jr-accent:var(--jr-teal); }
body.course-junior .card-face.theme-accessor,
body.course-junior .card-face.theme-landmark,
body.course-junior .card-face.theme-transport,
body.course-junior .card-face.theme-past,
body.course-junior .card-face.theme-place,
body.course-junior .card-face.theme-job { --jr-accent:var(--jr-blue); }
body.course-junior .card-face.theme-camp,
body.course-junior .card-face.theme-movie,
body.course-junior .card-face.theme-expression { --jr-accent:var(--jr-coral); }
body.course-junior .card-illus {
  width:min(100%,260px);
  padding:6px;
  line-height:0;
  background:#fffdf7;
  border:2px solid var(--jr-ink);
  border-radius:6px;
  box-shadow:3px 3px 0 var(--jr-paper-deep);
}
body.course-junior .card-illus svg,
body.course-junior .card-illus img {
  display:block;
  width:100% !important;
  height:auto !important;
  max-height:232px;
  object-fit:contain;
  border-radius:3px;
}
body.course-junior .card-word {
  max-width:100%;
  color:var(--jr-ink);
  font-family:'Nunito',sans-serif;
  font-size:2.55rem;
  font-weight:900;
  line-height:1.08;
  overflow-wrap:anywhere;
  text-shadow:none;
  letter-spacing:.01em;
}
body.course-junior .card-phonetic {
  color:var(--jr-ink-soft);
  font-family:'Nunito',sans-serif;
  font-size:1rem;

// Direction A prototype: one green mascot, one clear semantic action, and very few props.
const MASCOT_STYLE={
  green:'#18ad70', greenDark:'#11885b', ink:'#171717', paper:'#fffdf8',
  mint:'#dcefe5', yellow:'#ffd34e', orange:'#f28b54', pink:'#e97989',
  blue:'#8fc4d6', purple:'#a88bd2', gray:'#b9c0c0', brown:'#a87952'
};

function mascotLine(d,color=MASCOT_STYLE.ink,width=3.4){
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function mascotBody(x=70,y=82,scale=1,options={}){
  const {tilt=0,mood='neutral',fill=MASCOT_STYLE.green}=options;
  const mouths={
    neutral:'M-7 11 Q0 15 7 11',
    smile:'M-8 9 Q0 18 8 9',
    flat:'M-7 12 H7',
    surprised:'M0 9 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0',
    frown:'M-8 16 Q0 8 8 16'
  };
  const arms=mood==='shrug'
    ? `${mascotLine('M-21 2 Q-37 -6 -39 9',MASCOT_STYLE.ink,3)}${mascotLine('M21 2 Q37 -6 39 9',MASCOT_STYLE.ink,3)}`
    : `${mascotLine('M-21 2 Q-34 10 -30 22',MASCOT_STYLE.ink,3)}${mascotLine('M21 2 Q34 10 30 22',MASCOT_STYLE.ink,3)}`;
  return `<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${scale})">
    <path d="M-25 -31 Q-30 -6 -23 18 Q-15 37 0 39 Q16 37 24 17 Q31 -8 23 -31 Q11 -44 -4 -42 Q-19 -41 -25 -31Z" fill="${fill}" stroke="${MASCOT_STYLE.ink}" stroke-width="4" stroke-linejoin="round"/>
    ${arms}
    <circle cx="-9" cy="-7" r="3.2" fill="${MASCOT_STYLE.ink}"/>
    <circle cx="9" cy="-7" r="3.2" fill="${MASCOT_STYLE.ink}"/>
    ${mascotLine(mouths[mood]||mouths.neutral,MASCOT_STYLE.ink,2.6)}
  </g>`;
}

function mascotSvg(scene){
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">
    <rect width="${W}" height="${H}" rx="14" fill="${MASCOT_STYLE.paper}"/>
    ${scene}
  </svg>`;
}

  const imagePath=item.image || IMAGE_OVERRIDES[item.word];
  if(imagePath){
    return '<img src="'+imagePath+'" alt="" loading="lazy" decoding="async">';
  }
  if(item.style==='mascot')return mascotIllustrationFor(item);
  const fn=IL[item.word];
  return fn?fn():genericIllustration(item);
}

  juniorUnit2("Maybe",          "/ˈmeɪ.bi/",              "Expression","theme-expression"),
  juniorUnit2("Sofa",           "/ˈsoʊ.fə/",              "Object",    "theme-place"),
  juniorUnit2("Hungry",         "/ˈhʌŋ.ɡri/",             "State",     "theme-trait"),
  juniorUnit2("Notebook",       "/ˈnoʊt.bʊk/",            "School",    "theme-accessor"),
  juniorUnit2("Marker",         "/ˈmɑːr.kər/",            "School",    "theme-accessor"),
  juniorUnit2("Brush",          "/brʌʃ/",                 "School",    "theme-accessor"),
  juniorUnit2("Gift",           "/ɡɪft/",                 "Object",    "theme-accessor"),
  juniorUnit2("Pencil Case",    "/ˈpen.səl keɪs/",        "School",    "theme-accessor"),
  juniorUnit2("Bathroom",       "/ˈbæθ.ruːm/",            "Place",     "theme-place"),
  juniorUnit2("Table",          "/ˈteɪ.bəl/",             "Object",    "theme-place"),
  juniorUnit2("Bedroom",        "/ˈbed.ruːm/",            "Place",     "theme-place"),
  juniorUnit2("Near",           "/nɪr/",                  "Position",  "theme-expression"),
  juniorUnit2("Between",        "/bɪˈtwiːn/",             "Position",  "theme-expression"),
  juniorUnit2("Behind",         "/bɪˈhaɪnd/",             "Position",  "theme-expression"),
  juniorUnit2("In Front Of",    "/ɪn frʌnt əv/",          "Position",  "theme-expression"),
  juniorUnit2("Special",        "/ˈspeʃ.əl/",             "Trait",     "theme-trait"),
  juniorUnit2("Inside",         "/ɪnˈsaɪd/",              "Position",  "theme-expression"),
  juniorUnit2("Outside",        "/ˌaʊtˈsaɪd/",            "Position",  "theme-expression"),
  juniorUnit2("Right",          "/raɪt/",                 "Expression","theme-expression"),
  juniorUnit2("Each Other",     "/iːtʃ ˈʌð.ər/",          "Expression","theme-expression"),
  juniorUnit2("Above",          "/əˈbʌv/",                "Position",  "theme-expression"),
  juniorUnit2("Enough",         "/ɪˈnʌf/",                "Quantity",  "theme-trait"),
  juniorUnit2("Person",         "/ˈpɝː.sən/",             "People",    "theme-family"),
  juniorUnit2("People",         "/ˈpiː.pəl/",             "People",    "theme-family"),
];

function uniqueByWord(words){
  const seen=new Set();
  return words.filter(item=>{
    const key=item.word.toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

const COURSES = {
  junior:{
    label:"國中課程",
    defaultSession:"juniorUnit1",
    sessions:[
      {key:"juniorUnit1", label:"Unit 1", words:JUNIOR_UNIT1_WORDS},
      {key:"juniorUnit2", label:"Unit 2", words:JUNIOR_UNIT2_WORDS},
      {key:"juniorMixed", label:"國中綜合", words:uniqueByWord([...JUNIOR_UNIT1_WORDS, ...JUNIOR_UNIT2_WORDS])},
    ],
  },
  elementary:{
    label:"國小複習",
    defaultSession:"elementaryMixed",
    sessions:[
      {key:"midterm", label:"期中考", words:MIDTERM_WORDS},
      {key:"final", label:"期末考", words:FINAL_WORDS},
      {key:"elementaryMixed", label:"國小綜合", words:uniqueByWord([...MIDTERM_WORDS, ...FINAL_WORDS])},
    ],
  },
};

// ── State ──────────────────────────────────────────────────────────────────
let deck=[],idx=0,autoTimer=null,isAuto=false,autoRead=true,ttsVoice=null,phase=1,p2Revealed=false,p2Reviewing=false,courseKey='junior',sessionKey='juniorUnit1';
let p2Results={correct:[],wrong:[]};
const speeds={1:4000,2:2500,3:1500,4:900,5:500};
const speedLabels={1:"Slow",2:"Easy",3:"Medium",4:"Fast",5:"⚡ Flash"};

// ── TTS ────────────────────────────────────────────────────────────────────
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  const preferredNames=[
    'Google US English',
    'Microsoft Aria Online',
    'Microsoft Jenny Online',
    'Samantha',
    'Alex',
    'Daniel'
  ];
  const noveltyNames=[
    'Albert','Bad News','Bahh','Bells','Boing','Bubbles','Cellos','Deranged',
    'Good News','Hysterical','Jester','Organ','Ralph','Trinoids','Whisper','Zarvox'
  ];
  const isStandardVoice=v=>!noveltyNames.some(name=>v.name.toLowerCase().includes(name.toLowerCase()));
  ttsVoice=preferredNames.map(name=>vs.find(v=>v.lang.startsWith('en')&&v.name.includes(name))).find(Boolean)
    ||vs.find(v=>v.lang==='en-US'&&isStandardVoice(v)&&v.localService)
    ||vs.find(v=>v.lang.startsWith('en')&&isStandardVoice(v)&&v.localService)
    ||vs.find(v=>v.lang==='en-US'&&isStandardVoice(v))
    ||vs.find(v=>v.lang.startsWith('en')&&isStandardVoice(v))
    ||vs.find(v=>v.lang.startsWith('en'))
    ||vs[0]
    ||null;
}
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();

function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='en-US';utt.rate=0.92;utt.pitch=1;
  if(ttsVoice)utt.voice=ttsVoice;
  const wave=document.getElementById('sound-wave');
  const btn=document.getElementById('btn-speak');
  const p2b=document.getElementById('p2-listen-btn');
  wave&&wave.classList.add('active');
  btn&&btn.classList.add('speaking');
  p2b&&p2b.classList.add('speaking');
  utt.onend=utt.onerror=()=>{
    wave&&wave.classList.remove('active');
    btn&&btn.classList.remove('speaking');
    p2b&&p2b.classList.remove('speaking');
  };
  speechSynthesis.speak(utt);
}
function speakCurrent(){const item=deck[idx];if(item)speak(item.word);}
function toggleTTS(){autoRead=!autoRead;document.getElementById('tts-toggle').classList.toggle('on',autoRead);}

function currentCourse(){return COURSES[courseKey];}
function currentSession(){return currentCourse().sessions.find(s=>s.key===sessionKey)||currentCourse().sessions[0];}
function currentWords(){return currentSession().words;}
function sessionLabel(){return currentCourse().label+' · '+currentSession().label;}
function startDeck(){
  deck=shuffle([...currentWords()]);
  idx=0;
}
function updateCoursePresentation(){
  // Both course tracks use the approved editorial UI skin.  Keep the
  // existing class name for backwards-compatible CSS while making the
  // presentation choice independent from the course content.
  document.body.classList.toggle('course-junior',courseKey==='junior'||courseKey==='elementary');
  document.querySelectorAll('.course-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.course===courseKey));
  document.getElementById('main-title').textContent=courseKey==='junior'?'Junior Flash Cards':'Elementary Flash Cards';
}
function renderSessionSelector(){
  const wrap=document.getElementById('session-selector');
  wrap.replaceChildren();
  currentCourse().sessions.forEach(session=>{
    const btn=document.createElement('button');
    btn.className='session-btn'+(session.key===sessionKey?' active':'');
    btn.dataset.session=session.key;
    btn.textContent=session.label;
    btn.onclick=()=>setSession(session.key);
    wrap.appendChild(btn);
  });
}
function setCourse(key){
  courseKey=key;
  sessionKey=currentCourse().defaultSession;
  updateCoursePresentation();
  renderSessionSelector();
  stopAuto();
  document.getElementById('done-overlay').classList.remove('show');
  p2Reviewing=false;
  startDeck();
  if(phase===1)showCard(true);
  else{resetP2Results();loadP2Card(true);}
}
function setSession(key){
  sessionKey=key;
  document.querySelectorAll('.session-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.session===key));
  stopAuto();
  document.getElementById('done-overlay').classList.remove('show');
  p2Reviewing=false;
  startDeck();
  if(phase===1)showCard(true);
  else{resetP2Results();loadP2Card(true);}
}

// ── Phase ──────────────────────────────────────────────────────────────────
function setPhase(p){
  phase=p;
  document.querySelectorAll('.phase-btn').forEach((b,i)=>b.classList.toggle('active',i===p-1));
  const stage=document.getElementById('stage');
  const p2panel=document.getElementById('p2-panel');
  const btnAuto=document.getElementById('btn-auto');
  const btnNext=document.getElementById('btn-next');
  const bottomRow=document.getElementById('bottom-row');
  stopAuto();
  startDeck();updateCounter();
  if(p===1){
    p2Reviewing=false;
    stage.style.display='';p2panel.style.display='none';
    btnAuto.style.display='';btnNext.style.display='';bottomRow.style.display='';
    showCard(true);
  } else {
    stage.style.display='none';p2panel.style.display='flex';
    btnAuto.style.display='none';btnNext.style.display='none';bottomRow.style.display='none';
    p2Reviewing=false;resetP2Results();
    loadP2Card(true);
  }
}

function setButtonLabel(button,label){
  if(!button)return;
  const target=button.querySelector('[data-button-label]');
  if(target)target.textContent=label;
  else button.textContent=label;
}

// ── Phase 1 ────────────────────────────────────────────────────────────────
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function init(){startDeck();showCard(true);}
function updateCounter(){
  document.getElementById('counter').textContent=`${idx+1} / ${deck.length}`;
  document.getElementById('progress-bar').style.width=((idx+1)/deck.length*100).toFixed(1)+'%';
}
function showCard(instant){
  const item=deck[idx];updateCounter();
  if(instant){applyCard(item);if(autoRead)setTimeout(()=>speak(item.word),300);return;}
  const card=document.getElementById('card');
  card.classList.add('flipping');
  setTimeout(()=>{applyCard(item);card.classList.remove('flipping');if(autoRead)setTimeout(()=>speak(item.word),180);},300);
}
function applyCard(item){
  document.getElementById('card-face').className='card-face '+item.theme;
  document.getElementById('card-illus').innerHTML=illustrationFor(item);
  document.getElementById('card-word').textContent=item.word;
  document.getElementById('card-phonetic').textContent=item.phonetic;
  document.getElementById('card-cat').textContent=item.cat;
}
function nextCard(){if(idx>=deck.length-1){showDone();return;}idx++;showCard(false);}
function showDone(){
  stopAuto();
  document.getElementById('done-detail').replaceChildren();
  document.getElementById('btn-review-wrong').style.display='none';
  if(phase===2)showP2Results();
  else document.getElementById('done-msg').textContent=`${sessionLabel()} completed: ${deck.length} words`;
  document.getElementById('done-overlay').classList.add('show');
}
function restart(){
  document.getElementById('done-overlay').classList.remove('show');
  if(phase===1)init();else{p2Reviewing=false;startDeck();resetP2Results();loadP2Card(true);}
}
function shuffleAndRestart(){
  stopAuto();document.getElementById('done-overlay').classList.remove('show');
  startDeck();
  if(phase===1)showCard(true);else{p2Reviewing=false;resetP2Results();loadP2Card(true);}
}
function toggleAuto(){if(isAuto)stopAuto();else startAuto();}
function startAuto(){
  isAuto=true;setButtonLabel(document.getElementById('btn-auto'),'Stop');
  const ms=speeds[document.getElementById('speed-slider').value];
  autoTimer=setInterval(()=>{if(idx>=deck.length-1){stopAuto();showDone();return;}idx++;showCard(false);},ms);
}
function stopAuto(){isAuto=false;clearInterval(autoTimer);setButtonLabel(document.getElementById('btn-auto'),'Auto');}

// ── Phase 2 ────────────────────────────────────────────────────────────────
function resetP2Results(){
  p2Results={correct:[],wrong:[]};
  updateP2Score();
}
function updateP2Score(){
  const el=document.getElementById('p2-score');
  if(!el)return;
  const label=p2Reviewing?'Review':'Score';
  el.textContent=`${label}: ${p2Results.correct.length} correct · ${p2Results.wrong.length} wrong`;
}
function recordP2Answer(item,typed,ok){
  const entry={item,typed};
  if(ok)p2Results.correct.push(entry);else p2Results.wrong.push(entry);
  updateP2Score();
}
function addResultSection(detail,title,entries,showTyped){
  const section=document.createElement('div');
  section.className='result-section';
  const sectionTitle=document.createElement('div');
  sectionTitle.className='result-title';
  sectionTitle.textContent=title;
  const list=document.createElement('div');
  list.className='result-list';
  list.textContent=entries.length
    ? entries.map(({item,typed})=>showTyped&&typed?`${item.word} (you typed: ${typed})`:item.word).join(', ')
    : 'None';
  section.append(sectionTitle,list);
  detail.append(section);
}
function showP2Results(){
  const total=p2Results.correct.length+p2Results.wrong.length;
  const score=`Score: ${p2Results.correct.length} / ${total}`;
  document.getElementById('done-msg').textContent=p2Reviewing
    ? `Wrong-word review complete. ${score}`
    : `Spell practice complete. ${score}`;
  const detail=document.getElementById('done-detail');
  addResultSection(detail,`Correct (${p2Results.correct.length})`,p2Results.correct,false);
  addResultSection(detail,`Wrong (${p2Results.wrong.length})`,p2Results.wrong,true);
  const reviewBtn=document.getElementById('btn-review-wrong');
  reviewBtn.style.display=p2Results.wrong.length&&!p2Reviewing?'inline-block':'none';
}
function reviewWrongWords(){
  if(!p2Results.wrong.length)return;
  const wrongItems=p2Results.wrong.map(({item})=>item);
  document.getElementById('done-overlay').classList.remove('show');
  p2Reviewing=true;deck=shuffle([...wrongItems]);idx=0;resetP2Results();loadP2Card(true);
}
function loadP2Card(instant){
  const item=deck[idx];updateCounter();p2Revealed=false;
  updateP2Score();
  const input=document.getElementById('p2-input');
  const reveal=document.getElementById('p2-reveal');
  input.value='';input.className='';input.disabled=false;
  reveal.style.display='none';
  setButtonLabel(document.getElementById('p2-check-btn'),'Check');
  // show illustration in phase 2 too
  document.getElementById('p2-illus-wrap').innerHTML=illustrationFor(item);
  // hint: underscores per word part
  document.getElementById('p2-hint').textContent=item.word.split(' ').map(p=>'_'.repeat(p.length)).join('  ');
  if(autoRead||instant)setTimeout(()=>speak(item.word),instant?500:100);
  setTimeout(()=>input.focus(),100);
}
function checkSpelling(){
  if(p2Revealed){nextP2();return;}
  const item=deck[idx];
  const input=document.getElementById('p2-input');
  const typed=input.value.trim();
  const ok=typed.toLowerCase()===item.word.toLowerCase();
  recordP2Answer(item,typed,ok);
  input.className=ok?'correct':'wrong';
  if(!ok){input.style.animation='none';input.offsetHeight;input.style.animation='';}
  const reveal=document.getElementById('p2-reveal');
  document.getElementById('reveal-word').textContent=item.word;
  document.getElementById('reveal-phonetic').textContent=item.phonetic;
  const fb=document.getElementById('reveal-feedback');
  fb.textContent=ok?'✓ Correct!':'✗  The answer is above';
  fb.className='reveal-feedback '+(ok?'fb-correct':'fb-wrong');
  reveal.style.display='flex';
  input.disabled=true;p2Revealed=true;
  setButtonLabel(document.getElementById('p2-check-btn'),idx>=deck.length-1?'Show Score':'Next');
  speak(item.word);
}
function nextP2(){
  if(idx>=deck.length-1){showDone();return;}
  idx++;setButtonLabel(document.getElementById('p2-check-btn'),'Check');
  loadP2Card(false);
}

// ── Events ─────────────────────────────────────────────────────────────────
document.getElementById('speed-slider').addEventListener('input',function(){
  document.getElementById('speed-label').textContent=speedLabels[this.value];
  if(isAuto){stopAuto();startAuto();}
});
document.getElementById('card').addEventListener('click',()=>{if(phase===1)nextCard();});
document.getElementById('p2-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkSpelling();});
document.addEventListener('keydown',e=>{
  if(phase===1){
    if(e.key==='ArrowRight'||e.key===' ')nextCard();
    if(e.key==='ArrowLeft'&&idx>0){idx--;showCard(false);}
  }
});

// bubbles
const bC=['#ff6b6b','#ffd166','#4ecdc4','#a18cd1','#84fab0'];
for(let i=0;i<16;i++){
  const b=document.createElement('div');b.className='bubble';
  const s=40+Math.random()*100;
  b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}vw;background:${bC[i%5]};animation-duration:${8+Math.random()*14}s;animation-delay:${-Math.random()*20}s;`;
  document.body.appendChild(b);
}

updateCoursePresentation();
renderSessionSelector();
init();
</script>
